# Faster Qwen3 TTS API Configuration

model:
  name: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
  device: "cuda:0"
  dtype: "bfloat16"
  attn_implementation: "sdpa"

voices:
  dir: "/app/voices"
  gcs:
    bucket: "qarl-studio-bucket"   # GCS bucket name (leave empty to disable)
    prefix: "voices/qwen3"   # Prefix/path within the bucket

streaming:
  # Codec frames per chunk. A single int is a fixed chunk; a list is a ramp
  # (last value repeats) — small first chunk for low TTFA, larger tail chunks
  # for better RTF (less codec re-decode of the 25-frame left context).
  chunk_size: [2, 4, 8, 16, 32, 64]
